{% extends "base.html" %}
{% block title %}Nuevo registro{% endblock %}
{% block content %}
<section class="card form-card">
  <h1>Nuevo registro</h1>
  <p class="muted">Elegí el vehículo para abrir su registro.</p>
  <div class="form">
    {% for auto in vehiculos %}
    <a class="btn btn-secondary" href="{{ url_for('registro_nuevo', vid=auto.id) }}">{{ nombre_auto(auto) }} · {{ auto.patente }}</a>
    {% endfor %}
  </div>
</section>
{% endblock %}
